<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="The Firebird burger illustration">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a1214"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2bd72"/>
      <stop offset="55%" stop-color="#df9c48"/>
      <stop offset="100%" stop-color="#c27d2d"/>
    </linearGradient>
    <linearGradient id="bunBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ca8833"/>
      <stop offset="100%" stop-color="#a26420"/>
    </linearGradient>
    <linearGradient id="patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3722"/>
      <stop offset="100%" stop-color="#3a2111"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="800" cy="430" r="340" fill="url(#glow)"/>

  <text x="72" y="150" font-family="Georgia, serif" font-size="230" font-style="italic" fill="#ef4444" opacity="0.06">03</text>

  <g transform="translate(200,0) scale(1.5,1)">

  <!-- flames -->
  <g fill="none" stroke="#f97316" stroke-linecap="round" opacity="0.5">
    <path d="M252 300 q-14 24 4 38" stroke-width="7"/>
    <path d="M560 292 q-6 26 14 34" stroke-width="7"/>
  </g>
  <g fill="none" stroke="#ef4444" stroke-linecap="round" opacity="0.4">
    <path d="M230 270 q-6 34 20 40" stroke-width="6"/>
    <path d="M584 264 q-2 34 24 36" stroke-width="6"/>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.2">
    <path d="M340 240 q-20 -45 6 -75 q24 -28 2 -58" stroke-width="11"/>
    <path d="M460 235 q-18 -42 6 -72 q22 -28 -2 -56" stroke-width="10"/>
  </g>

  <!-- plate -->
  <ellipse cx="400" cy="808" rx="315" ry="48" fill="#17181d" stroke="#2b2f38" stroke-width="3"/>
  <ellipse cx="400" cy="808" rx="315" ry="48" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.18"/>

  <!-- bottom bun -->
  <ellipse cx="400" cy="746" rx="235" ry="46" fill="url(#bunBottom)"/>
  <path d="M175 740 q225 -50 450 0 l-20 26 q-205 -44 -410 0 z" fill="#bb7829"/>

  <!-- bottom patty -->
  <ellipse cx="400" cy="694" rx="228" ry="38" fill="url(#patty)"/>
  <g stroke="#2b160c" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M210 690 q40 -8 80 0 q40 8 80 0 q40 -8 80 0 q40 8 90 2"/>
    <path d="M200 706 q50 -8 100 0 q50 8 100 0 q50 -8 100 0"/>
  </g>

  <!-- cheese -->
  <path d="M178 662 q18 32 52 30 q36 -2 58 -24 q16 28 48 28 q32 0 50 -26 q20 30 52 28 q32 -2 50 -26 q18 26 46 26 q28 0 50 -20 q28 -18 40 -46 q6 24 34 22 q28 -2 40 -18 q-4 -24 -28 -38 l-470 0 q-36 12 -62 36 z" fill="url(#cheese)"/>

  <!-- jalapeño rings -->
  <g stroke="#2f6e24" stroke-width="4">
    <circle cx="308" cy="622" r="26" fill="#4e9c3a"/>
    <circle cx="308" cy="622" r="13" fill="#cfe6a0"/>
    <circle cx="308" cy="622" r="4" fill="#7aa84f"/>
    <circle cx="400" cy="612" r="28" fill="#4e9c3a"/>
    <circle cx="400" cy="612" r="14" fill="#cfe6a0"/>
    <circle cx="400" cy="612" r="4" fill="#7aa84f"/>
    <circle cx="492" cy="624" r="24" fill="#4e9c3a"/>
    <circle cx="492" cy="624" r="12" fill="#cfe6a0"/>
    <circle cx="492" cy="624" r="4" fill="#7aa84f"/>
    <circle cx="352" cy="636" r="20" fill="#4e9c3a"/>
    <circle cx="352" cy="636" r="10" fill="#cfe6a0"/>
    <circle cx="352" cy="636" r="3" fill="#7aa84f"/>
    <circle cx="448" cy="636" r="20" fill="#4e9c3a"/>
    <circle cx="448" cy="636" r="10" fill="#cfe6a0"/>
    <circle cx="448" cy="636" r="3" fill="#7aa84f"/>
  </g>

  <!-- chipotle sauce swirl -->
  <path d="M250 600 q60 -24 120 -6 q50 16 100 4 q40 -10 80 -2 l10 18 q-50 -8 -90 6 q-52 16 -104 -2 q-56 -16 -106 6 z" fill="#d9592f" opacity="0.9"/>
  <g fill="none" stroke="#b8431f" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M280 596 q40 -14 80 -4"/>
    <path d="M430 592 q36 -10 78 -4"/>
  </g>

  <!-- crispy shallots -->
  <g fill="#d99a4e">
    <ellipse cx="350" cy="584" rx="10" ry="6" transform="rotate(-15 350 584)"/>
    <ellipse cx="390" cy="580" rx="10" ry="6"/>
    <ellipse cx="438" cy="584" rx="10" ry="6" transform="rotate(12 438 584)"/>
    <ellipse cx="468" cy="578" rx="9" ry="5" transform="rotate(25 468 578)"/>
  </g>

  <!-- top bun -->
  <ellipse cx="400" cy="558" rx="238" ry="42" fill="url(#bunTop)"/>
  <path d="M170 550 C170 378 255 308 400 308 C545 308 630 378 630 550 Z" fill="url(#bunTop)"/>
  <path d="M170 550 C170 378 255 308 400 308 C545 308 630 378 630 550 Z" fill="none" stroke="#fff" stroke-width="5" opacity="0.25"/>
  <ellipse cx="400" cy="550" rx="238" ry="42" fill="#a26420" opacity="0.35"/>

  <!-- sesame -->
  <g fill="#f8e7c4">
    <ellipse cx="330" cy="418" rx="13" ry="7" transform="rotate(-20 330 418)"/>
    <ellipse cx="410" cy="378" rx="13" ry="7"/>
    <ellipse cx="480" cy="428" rx="13" ry="7" transform="rotate(15 480 428)"/>
    <ellipse cx="300" cy="468" rx="13" ry="7" transform="rotate(-30 300 468)"/>
    <ellipse cx="380" cy="448" rx="12" ry="6" transform="rotate(8 380 448)"/>
    <ellipse cx="520" cy="478" rx="12" ry="6" transform="rotate(25 520 478)"/>
    <ellipse cx="452" cy="398" rx="12" ry="6" transform="rotate(-10 452 398)"/>
  </g>
  </g>
</svg>
